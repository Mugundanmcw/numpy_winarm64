name: Windows tests

on:
  push:
    branches:
      - CI_for_WoA 
      - main
      - maintenance/**
      
  pull_request:
    branches:
      - main
      - maintenance/**

jobs:
  python64bit_openblas:
    name: x86-64, LP64 OpenBLAS
    runs-on: windows-2022
    # To enable this job on a fork, comment out:
    # if: github.repository == 'numpy/numpy'
    strategy:
      fail-fast: false
      matrix:
        compiler-pyversion:
          - ["MSVC", "3.11"]
          - ["Clang-cl", "3.14t-dev"]

    steps:
    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        submodules: recursive
        fetch-tags: true
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.compiler-pyversion[1] }}

    - name: Install build dependencies from PyPI
      run: |
        pip install -r requirements/build_requirements.txt

    - name: Install pkg-config
      run: |
        choco install -y --stoponfirstfailure --checksum 6004DF17818F5A6DBF19CB335CC92702 pkgconfiglite
        echo "PKG_CONFIG_PATH=${{ github.workspace }}/.openblas" >> $env:GITHUB_ENV


    - name: Install Clang-cl
      if: matrix.compiler-pyversion[0] == 'Clang-cl'
      run: |
        # llvm is preinstalled, but leave
        # this here in case we need to pin the
        # version at some point.
        #choco install llvm -y

    - name: Install NumPy (MSVC)
      if: matrix.compiler-pyversion[0] == 'MSVC'
      run: |
        pip install -r requirements/ci_requirements.txt
        spin build --with-scipy-openblas=32 -j2 -- --vsenv

    - name: Install NumPy (Clang-cl)
      if: matrix.compiler-pyversion[0] == 'Clang-cl'
      run: |
        "[binaries]","c = 'clang-cl'","cpp = 'clang-cl'","ar = 'llvm-lib'","c_ld = 'lld-link'","cpp_ld = 'lld-link'" | Out-File $PWD/clang-cl-build.ini -Encoding ascii
        pip install -r requirements/ci_requirements.txt
        spin build --with-scipy-openblas=32 -j2 -- --vsenv --native-file=$PWD/clang-cl-build.ini

    - name: Meson Log
      shell: bash
      if: ${{ failure()  }}
      run: |
        cat build/meson-logs/meson-log.txt

    - name: Install test dependencies
      run: |
        python -m pip install -r requirements/test_requirements.txt
        python -m pip install threadpoolctl

    - name: Run test suite
      run: |
        spin test -- --timeout=600 --durations=10

  msvc_python_no_openblas:
    name: ${{ matrix.compiler }}, ${{ matrix.architecture }} Python, ${{ matrix.blas-config }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: MSVC
            os: windows-2022
            architecture: x86
            blas-config: no BLAS
            build-type: no-blas
          - compiler: MSVC
            os: windows-11-arm
            architecture: arm64
            blas-config: no BLAS
            build-type: no-blas
          - compiler: Clang-cl
            os: windows-11-arm
            architecture: arm64
            blas-config: with OpenBLAS
            build-type: with-openblas
    # To enable this job on a fork, comment out:
    if: github.repository == 'numpy/numpy'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-tags: true
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          architecture: ${{ matrix.architecture }}

      - name: Setup MSVC
        if: matrix.compiler == 'MSVC'
        uses: bus1/cabuild/action/msdevshell@e22aba57d6e74891d059d66501b6b5aed8123c4d  # v1
        with:
          architecture: ${{ matrix.architecture }}

      - name: Setup LLVM for ARM64
        if: matrix.compiler == 'Clang-cl' && matrix.architecture == 'arm64'
        uses: ./.github/windows_arm64_steps

      - name: Install build dependencies from PyPI
        run: |
          pip install -r requirements/build_requirements.txt

      - name: Install CI dependencies (for OpenBLAS builds)
        if: matrix.build-type == 'with-openblas'
        run: |
          pip install -r requirements/ci_requirements.txt

      - name: Build and install (no BLAS)
        if: matrix.build-type == 'no-blas'
        run: |
          python -m pip install . -v -Ccompile-args="-j2" -Csetup-args="-Dallow-noblas=true"

      - name: Build NumPy with Clang-cl (with OpenBLAS)
        if: matrix.build-type == 'with-openblas'
        run: |
          "[binaries]","c = 'clang-cl'","cpp = 'clang-cl'","ar = 'llvm-lib'","c_ld = 'lld-link'","cpp_ld = 'lld-link'" | Out-File $PWD/clang-cl-${{ matrix.architecture }}.ini -Encoding ascii
          spin build --with-scipy-openblas=32 -j2 -- --vsenv --native-file=$PWD/clang-cl-${{ matrix.architecture }}.ini

      - name: Meson Log
        shell: bash
        if: ${{ failure() && matrix.build-type == 'with-openblas' }}
        run: |
          cat build/meson-logs/meson-log.txt

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements/test_requirements.txt

      - name: Install additional test dependencies (for OpenBLAS builds)
        if: matrix.build-type == 'with-openblas'
        run: |
          python -m pip install threadpoolctl

      - name: Run test suite (full)
        if: matrix.build-type == 'with-openblas'
        run: |
          spin test -- --timeout=600 --durations=10

      - name: Run test suite (fast)
        if: matrix.build-type == 'no-blas'
        run: |
          cd tools
          python -m pytest --pyargs numpy -m "not slow" -n2 --timeout=600 --durations=10
